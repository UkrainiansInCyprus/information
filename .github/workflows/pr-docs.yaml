name: "Build Docs for Pull Requests"
on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    timeout-minutes: 5
    # Set job outputs to values from filter step
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: filter
      with:
        filters: |
          docs:
            - pyproject.toml
            - uv.lock
            - zensical.toml
            - docs/**
            - .github/workflows/pr-docs.yaml

  build-and-deploy:
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      # Setup and build the docs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: 3.14
      - run: uv sync --no-dev
      - run: uv run zensical build --clean
      - name: Deploy to Cloudflare Pages
        env:
          PROJECT_NAME: information
          BRANCH: ${{ github.event.pull_request.head.sha }}
          PREVIEW_DOMAIN: ${{ github.event.pull_request.head.sha }}-information.ukrainiansincyprus.workers.dev
          PREVIEW_URL: https://${{ github.event.pull_request.head.sha }}-information.ukrainiansincyprus.workers.dev
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ./site --name=${{ env.PROJECT_NAME }} --tag=${{ env.BRANCH }} --domain=${{ env.PREVIEW_DOMAIN }} --compatibility-date 2026-08-03
      - name: Comment preview URL on PR
        env:
          PREVIEW_URL: https://${{ github.event.pull_request.head.sha }}-information.ukrainiansincyprus.workers.dev
          PREVIEW_DOMAIN: ${{ github.event.pull_request.head.sha }}-information.ukrainiansincyprus.workers.dev
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const marker = '<!-- docs-preview-url -->';
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `Docs preview is ready: ${process.env.PREVIEW_URL}`,
              '',
              `Host: ${process.env.PREVIEW_DOMAIN}`,
              `Commit: ${sha}`,
              '',
              'This preview will be replaced with an expired placeholder when the PR is closed.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

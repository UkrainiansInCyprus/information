name: "Build Docs for Pull Requests"
on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    timeout-minutes: 5
    # Set job outputs to values from filter step
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: filter
      with:
        filters: |
          docs:
            - pyproject.toml
            - uv.lock
            - zensical.toml
            - docs/**
            - .github/workflows/pr-docs.yaml

  build-and-deploy:
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Setup and build the docs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: 3.14
      - run: uv sync --no-dev
      - run: uv run zensical build --clean
      - name: Deploy to Cloudflare Pages
        env:
          PROJECT_NAME: information
          BRANCH: ${{ github.event.pull_request.head.sha }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ./site --name=${{ env.PROJECT_NAME }} --tag=${{ env.BRANCH }} --domain=${{ env.BRANCH }}-${{ env.PROJECT_NAME }}.ukrainiansincyprus.workers.dev --compatibility-date 2026-08-03
